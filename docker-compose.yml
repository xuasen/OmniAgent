services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./schemas:/app/schemas
      - ./tests:/app/tests
    environment:
      - OMNIAGENT_HOST=0.0.0.0
      - OMNIAGENT_PORT=8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=omniagent
      - DB_PASSWORD=omniagent_dev
      - DB_NAME=omniagent
      - LOG_LEVEL=debug
      - OMNIAGENT_CONFIG=/app/config/omniagent.yaml
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn omniagent.app:create_app --factory --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omniagent
      POSTGRES_PASSWORD: omniagent_dev
      POSTGRES_DB: omniagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniagent"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=omniagent
      - DB_PASSWORD=omniagent_dev
      - DB_NAME=omniagent
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    profiles:
      - migrate

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=omniagent
      - DB_PASSWORD=omniagent_dev
      - DB_NAME=omniagent_test
      - OMNIAGENT_CONFIG=/app/config/omniagent.yaml
    depends_on:
      postgres:
        condition: service_healthy
    command: pytest tests/ -v --tb=short
    profiles:
      - test

volumes:
  pgdata:
